# hyprlock — official Catppuccin Mocha theme (accent: mauve).
# From https://github.com/catppuccin/hyprlock ; local tweaks:
#   - background points at the same wallpaper swaybg uses
#   - avatar (needs ~/.face) block removed
#   - fingerprint block re-added below now the Elan reader is driven
#
# THIS FILE IS NOT THE ONE HYPRLOCK IS RUN WITH — see ./hyprlock-config.sh.
# It is the SOURCE OF TRUTH for the design, and is still the file to edit, but
# ../niri/lock.sh passes hyprlock a generated copy in which every widget is
# re-emitted once per monitor with its geometry multiplied by that monitor's
# scale. Editing a number here is all that is needed; the generator rewrites it.
#
# THE NUMBERS BELOW ARE DEVICE PIXELS AT SCALE 1.0. hyprlock binds
# wp_fractional_scale_v1, but only to size its buffer (LockSurface.cpp:
# `size = (size_ * fractionalScale).floor()`) — widgets are then laid out in
# that buffer's own pixels, so it has no notion of scale at all. Measured on a
# nested niri: the clock's ink was 371x122 px at output scale 1.0, 1.25 AND 2.0,
# while hyprlock logged "Got fractional scale: 200.0%". Hence the generator.
#
# Parity with the SDDM greeter is maintained by both sides deriving the scale
# the SAME way — niri's guess_monitor_scale over the EDID millimetres — because
# the greeter runs before any session exists and cannot ask niri. The QML half
# is in ../../modules/desktop/sddm-theme/Main.qml. Change the rule in one place
# and change it in the other.
source = $HOME/.config/hypr/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font
# The input-field placeholder's size: (int)(54 / 4) at scale 1. A label using
# it is resized per monitor by hyprlock-config.sh to match the placeholder.
$fieldFont = 13

# GENERAL
general {
  hide_cursor = true
}

# FINGERPRINT — the Elan reader is now driven (modules/hardware/fingerprint.nix),
# so hyprlock (v0.9.5, built with the sdbus-c++ backend) talks to fprintd over
# D-Bus directly. This is a SEPARATE backend from pam_fprintd: enabling fprintd
# in PAM does nothing for hyprlock, the block below is what makes it listen.
#
# The messages render in the FINGERPRINT STATUS label below, so a swipe is
# visibly acknowledged: `ready` while it waits, `present` mid-read, a retry
# prompt on a miss, and — when fingerprint unlock gives up — the reason it is
# disabled, held there until it comes back. Fingerprint failures never reach the
# input field; that is patched in ../../modules/desktop/hyprlock-auth-messages.patch
# so the field speaks only for the password. That is the "did it register?"
# feedback we want, since this elanmoc2
# sensor is flaky and sometimes returns "transfer timed out". retry_delay re-arms
# verify after a bad read. pam stays enabled, so a failed/missing swipe always
# falls through to typing the password — fingerprint is never a replacement.
auth {
  pam {
    enabled = true
  }
  fingerprint {
    enabled = true
    ready_message = 󰈷 Scan fingerprint to unlock
    present_message = 󰈷 Scanning…
    retry_delay = 250
  }
}

# BACKGROUND — same image as the desktop (swaybg)
background {
  monitor =
  path = /home/valer/.local/share/backgrounds/wall.jpg
  blur_passes = 2
  blur_size = 7
  color = $base
}

# TIME (top-right)
# Kept in parity with the SDDM greeter's clock — see
# ../../modules/desktop/sddm-theme/Main.qml. The greeter's clock is the one
# being matched here, so these numbers follow ITS TimeSize/DateSize.
#
# font_size IS IN POINTS. Its label sizes go to pango, which resolves points at
# 96 DPI, while the greeter's QML uses font.pixelSize — literal pixels. The two
# differ by exactly 4/3, which is how a "90" on both sides still rendered the
# lock screen's clock a third larger than the greeter's (measured: 494px of date
# ink against 371px). So the greeter's 90px time is 90 * 3/4 = 68pt here, and
# its 25px date is 19pt.
#
# Bold comes from pango markup rather than a bold font_family: hyprgraphics runs
# label text through pango_parse_markup(), so <b> works, whereas naming the face
# directly is the fragile route — `fc-match "JetBrainsMono Nerd Font Bold"`
# resolves to DejaVu Sans on this machine.
#
# y is -30, not 0: the greeter insets its clock 30px from the top as well as the
# right, and the time sat flush against the screen edge here.
label {
  monitor =
  text = <b>$TIME</b>
  color = $text
  font_size = 68
  font_family = $font
  position = -30, -30
  halign = right
  valign = top
}

# DATE (top-right, under the time)
# 19pt = the greeter's 25px date, same points-to-pixels conversion as the time
# above. $subtext0 rather than $text, matching the greeter's dimmer date.
# The y offset is set from a render comparison, not from arithmetic — see the
# preview recipe in ../../modules/desktop/sddm.nix for how both screens are
# rendered offscreen and measured against each other.
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $subtext0
  font_size = 19
  font_family = $font
  position = -30, -149
  halign = right
  valign = top
}

# INPUT FIELD (centered)
input-field {
  monitor =
  # NOT inherited: hyprlock defaults input-field's font_family to "Sans"
  # (ConfigManager.cpp), and unlike the labels above this block never set it —
  # so the placeholder rendered in DejaVu Sans while every other piece of text
  # in this setup is JetBrains Mono. Caught by rendering the lock screen and the
  # greeter side by side; the proportional spacing was unmistakable next to the
  # greeter's monospace.
  font_family = $font
  # Kept identical to FieldWidth/FieldHeight in ../../modules/desktop/sddm.nix.
  # Changing it here changes the greeter's derived sizes too: the dots are
  # nearbyint(h * 0.2 * 0.5) * 2 px and the placeholder is (int)(h / 4) points,
  # both of which that file restates in pixels.
  #
  # 280 AND NOT 270, BECAUSE `size` IS A MINIMUM, NOT A WIDTH. hyprlock resizes
  # the field every frame (PasswordInputField.cpp::updateWidth):
  #
  #     targetSizeX = configSize.x
  #     if (passwordLength == 0 && placeholder.asset)
  #         targetSizeX = placeholder.asset->m_vSize.x + size->goal().y
  #     targetSizeX = max(targetSizeX, configSize.x)
  #
  # so an empty field is as wide as its PLACEHOLDER plus one field height, and
  # snaps back to `size` the moment a dot is drawn. At 270 that snap was
  # visible: on the 1.25-scaled panel the field is 338x68 device px, the
  # placeholder renders 280px wide, and 280 + 68 = 348 — so the box lost 10px
  # the instant you started typing, which the greeter (fixed width) never did.
  # 280 puts the configured width above the placeholder's demand at every scale,
  # so the max() always picks configSize.x and the box never moves.
  #
  # THE SLACK IS SMALL AND WORTH RE-CHECKING if this placeholder's wording, the
  # font, or the username ever changes — 20 characters is what fits. The demand
  # is 20 * round(0.8 * pt) + h, where h = round(54 * scale) and pt = h / 4
  # truncated to an int (hyprlock asks pango for POINTS, resolved at 96 DPI):
  #
  #     scale 1.00   h  54   13pt   200 + 54 = 254   vs 280   ok
  #     scale 1.25   h  68   17pt   280 + 68 = 348   vs 350   ok, by 2px
  #     scale 1.50   h  81   20pt   320 + 81 = 401   vs 420   ok
  #     scale 2.00   h 108   27pt   440 +108 = 548   vs 560   ok
  #
  # Re-measure a new placeholder the way those numbers were got — hyprgraphics
  # lays the text out with plain pango_cairo, so pango-view agrees with it:
  #
  #   nix shell nixpkgs#pango nixpkgs#imagemagick -c sh -c \
  #     'pango-view -q --markup --margin 0 --font "JetBrainsMono Nerd Font 17" \
  #        -t "<i>󰌾 Logged in as </i>valer" -o /tmp/p.png
  #      magick identify -format "%wx%h\n" /tmp/p.png'
  #
  # fail_text is NOT covered by this and still grows the box on a bad password
  # ("Authentication failure" is 22 characters, wider than any of the widths
  # above). Left alone deliberately: shrinking it would mean rewording the
  # failure message. The greeter grows its field the same way
  # (../../modules/desktop/sddm-theme/Main.qml), so the two still match.
  size = 280, 54
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $accent
  fail_color = $red
  # The reason alone, no attempt counter. Only password failures land here.
  fail_text = <i>$FAIL</i>
  # NO check_text, AND THAT IS THE SETTING, not an omission. Leaving it at its
  # default empty string is what makes the DOTS STAY PUT while PAM decides,
  # because hyprlock keys that behaviour off this very emptiness:
  #
  #     void CPasswordInputField::updateDots() {
  #         ...
  #         if (checkWaiting && configCheckText.empty())
  #             return;            // dot count deliberately NOT updated
  #
  # It clears the password buffer on submit, so passwordLength drops to 0 the
  # moment you press Enter — but with no check text that early return keeps
  # dots.currentAmount frozen at what you typed, and draw() skips the
  # placeholder for the same case. The row of dots simply holds, which is the
  # indicator. Set a check_text and you get the opposite: the dots collapse and
  # the text takes the field.
  #
  # A "󰔟 Unlocking…" was tried here and dropped. It was added for the GREETER's
  # sake, back when its PAM stack sat on a ten-second fingerprint timeout and
  # the only feedback was a second press of Enter — with that fixed
  # (../../modules/hardware/fingerprint.nix) the check is fast enough that a
  # message just flashes, and held dots read better. ../../modules/desktop/
  # sddm-theme/Main.qml holds the dots for the same window, so the two screens
  # still behave alike.
  capslock_color = $yellow
  position = 0, -20
  halign = center
  valign = center
}

# FINGERPRINT STATUS (under the input field) — $FPRINTPROMPT carries the
# ready/scanning/retry text from the `auth { fingerprint }` block, and is the ONLY
# place fingerprint messages appear: `Scan fingerprint to unlock` while waiting,
# `Scanning…` during a read, `Could not match fingerprint. Try again.` after a
# miss. Only TOO MANY wrong fingers turns it off for good — `Fingerprint auth
# disabled (too many failed attempts)` until the next resume. Every other error
# re-arms the sensor by itself: the elanmoc2 driver's ~10s no-finger timeout
# silently, a real outage (fprintd gone, sensor unclaimable, …) as `Fingerprint
# unavailable (<reason>)` while it retries.
# The scanning/retry messages carry the 󰈷 icon: the two messages above set it
# here, and the patch prefixes hyprlock's own hardcoded retry prompts with the
# same glyph — change it in both places. Disabled/unavailable get no icon, so a
# missing icon reads as "fingerprint is not available".
#
# font_size = $fieldFont makes this the placeholder's size on every monitor; see
# that variable and hyprlock-config.sh.
label {
  monitor =
  text = $FPRINTPROMPT
  color = $subtext0
  font_size = $fieldFont
  font_family = $font
  position = 0, 100
  halign = center
  valign = bottom
}
