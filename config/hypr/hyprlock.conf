# hyprlock — official Catppuccin Mocha theme (accent: mauve).
# From https://github.com/catppuccin/hyprlock ; local tweaks:
#   - background points at the same wallpaper swaybg uses
#   - avatar (needs ~/.face) block removed
#   - fingerprint block re-added below now the Elan reader is driven
source = $HOME/.config/hypr/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# GENERAL
general {
  hide_cursor = true
}

# FINGERPRINT — the Elan reader is now driven (modules/hardware/fingerprint.nix),
# so hyprlock (v0.9.5, built with the sdbus-c++ backend) talks to fprintd over
# D-Bus directly. This is a SEPARATE backend from pam_fprintd: enabling fprintd
# in PAM does nothing for hyprlock, the block below is what makes it listen.
#
# The messages render inside the input-field, so a swipe is visibly acknowledged:
# `ready` while it waits, `present` mid-read, and the red fail_text on a miss —
# which is exactly the "did it register?" feedback we want, since this elanmoc2
# sensor is flaky and sometimes returns "transfer timed out". retry_delay re-arms
# verify after a bad read. pam stays enabled, so a failed/missing swipe always
# falls through to typing the password — fingerprint is never a replacement.
auth {
  pam {
    enabled = true
  }
  fingerprint {
    enabled = true
    ready_message = 󰈷 Scan fingerprint to unlock
    present_message = 󰈷 Scanning…
    retry_delay = 250
  }
}

# BACKGROUND — same image as the desktop (swaybg)
background {
  monitor =
  path = /home/valer/.local/share/backgrounds/wall.jpg
  blur_passes = 2
  blur_size = 7
  color = $base
}

# NOW PLAYING (top-left) — blank when nothing is playing
label {
  monitor =
  text = cmd[update:5000] /home/valer/.config/hypr/now-playing.sh
  color = $subtext0
  font_size = 20
  font_family = $font
  position = 30, -30
  halign = left
  valign = top
}

# TIME (top-right)
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE (top-right, under the time)
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

# INPUT FIELD (centered)
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -20
  halign = center
  valign = center
}

# FINGERPRINT STATUS (under the input field) — $FPRINTPROMPT carries the
# ready/scanning/fail text from the `auth { fingerprint }` block. The input-field
# only surfaces those mid-check, and its idle slot is taken by placeholder_text,
# so on a fast read the message just flashes. This label shows it on its own line
# instead: `Scan fingerprint to unlock` while waiting, `Scanning…` during a read.
label {
  monitor =
  text = $FPRINTPROMPT
  color = $subtext0
  font_size = 16
  font_family = $font
  position = 0, 100
  halign = center
  valign = bottom
}
