# hyprlock — official Catppuccin Mocha theme (accent: mauve).
# From https://github.com/catppuccin/hyprlock ; local tweaks:
#   - background points at the same wallpaper swaybg uses
#   - avatar (needs ~/.face) block removed
#   - fingerprint block re-added below now the Elan reader is driven
#
# THIS FILE IS NOT THE ONE HYPRLOCK IS RUN WITH — see ./hyprlock-config.sh.
# It is the SOURCE OF TRUTH for the design, and is still the file to edit, but
# ../niri/lock.sh passes hyprlock a generated copy in which every widget is
# re-emitted once per monitor with its geometry multiplied by that monitor's
# scale. Editing a number here is all that is needed; the generator rewrites it.
#
# THE NUMBERS BELOW ARE DEVICE PIXELS AT SCALE 1.0. hyprlock binds
# wp_fractional_scale_v1, but only to size its buffer (LockSurface.cpp:
# `size = (size_ * fractionalScale).floor()`) — widgets are then laid out in
# that buffer's own pixels, so it has no notion of scale at all. Measured on a
# nested niri: the clock's ink was 371x122 px at output scale 1.0, 1.25 AND 2.0,
# while hyprlock logged "Got fractional scale: 200.0%". Hence the generator.
#
# Parity with the SDDM greeter is maintained by both sides deriving the scale
# the SAME way — niri's guess_monitor_scale over the EDID millimetres — because
# the greeter runs before any session exists and cannot ask niri. The QML half
# is in ../../modules/desktop/sddm-theme/Main.qml. Change the rule in one place
# and change it in the other.
source = $HOME/.config/hypr/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# GENERAL
general {
  hide_cursor = true
}

# FINGERPRINT — the Elan reader is now driven (modules/hardware/fingerprint.nix),
# so hyprlock (v0.9.5, built with the sdbus-c++ backend) talks to fprintd over
# D-Bus directly. This is a SEPARATE backend from pam_fprintd: enabling fprintd
# in PAM does nothing for hyprlock, the block below is what makes it listen.
#
# The messages render inside the input-field, so a swipe is visibly acknowledged:
# `ready` while it waits, `present` mid-read, and the red fail_text on a miss —
# which is exactly the "did it register?" feedback we want, since this elanmoc2
# sensor is flaky and sometimes returns "transfer timed out". retry_delay re-arms
# verify after a bad read. pam stays enabled, so a failed/missing swipe always
# falls through to typing the password — fingerprint is never a replacement.
auth {
  pam {
    enabled = true
  }
  fingerprint {
    enabled = true
    ready_message = 󰈷 Scan fingerprint to unlock
    present_message = 󰈷 Scanning…
    retry_delay = 250
  }
}

# BACKGROUND — same image as the desktop (swaybg)
background {
  monitor =
  path = /home/valer/.local/share/backgrounds/wall.jpg
  blur_passes = 2
  blur_size = 7
  color = $base
}

# NOW PLAYING (top-left) — blank when nothing is playing
label {
  monitor =
  text = cmd[update:5000] /home/valer/.config/hypr/now-playing.sh
  color = $subtext0
  font_size = 20
  font_family = $font
  position = 30, -30
  halign = left
  valign = top
}

# TIME (top-right)
# Kept in parity with the SDDM greeter's clock — see
# ../../modules/desktop/sddm-theme/Main.qml. The greeter's clock is the one
# being matched here, so these numbers follow ITS TimeSize/DateSize.
#
# font_size IS IN POINTS. Its label sizes go to pango, which resolves points at
# 96 DPI, while the greeter's QML uses font.pixelSize — literal pixels. The two
# differ by exactly 4/3, which is how a "90" on both sides still rendered the
# lock screen's clock a third larger than the greeter's (measured: 494px of date
# ink against 371px). So the greeter's 90px time is 90 * 3/4 = 68pt here, and
# its 25px date is 19pt.
#
# Bold comes from pango markup rather than a bold font_family: hyprgraphics runs
# label text through pango_parse_markup(), so <b> works, whereas naming the face
# directly is the fragile route — `fc-match "JetBrainsMono Nerd Font Bold"`
# resolves to DejaVu Sans on this machine.
#
# y is -30, not 0: the greeter insets its clock 30px from the top as well as the
# right, and the time sat flush against the screen edge here.
label {
  monitor =
  text = <b>$TIME</b>
  color = $text
  font_size = 68
  font_family = $font
  position = -30, -30
  halign = right
  valign = top
}

# DATE (top-right, under the time)
# 19pt = the greeter's 25px date, same points-to-pixels conversion as the time
# above. $subtext0 rather than $text, matching the greeter's dimmer date.
# The y offset is set from a render comparison, not from arithmetic — see the
# preview recipe in ../../modules/desktop/sddm.nix for how both screens are
# rendered offscreen and measured against each other.
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $subtext0
  font_size = 19
  font_family = $font
  position = -30, -149
  halign = right
  valign = top
}

# INPUT FIELD (centered)
input-field {
  monitor =
  # NOT inherited: hyprlock defaults input-field's font_family to "Sans"
  # (ConfigManager.cpp), and unlike the labels above this block never set it —
  # so the placeholder rendered in DejaVu Sans while every other piece of text
  # in this setup is JetBrains Mono. Caught by rendering the lock screen and the
  # greeter side by side; the proportional spacing was unmistakable next to the
  # greeter's monospace.
  font_family = $font
  # Kept identical to FieldWidth/FieldHeight in ../../modules/desktop/sddm.nix.
  # Changing it here changes the greeter's derived sizes too: the dots are
  # nearbyint(h * 0.2 * 0.5) * 2 px and the placeholder is (int)(h / 4) points,
  # both of which that file restates in pixels.
  size = 270, 54
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -20
  halign = center
  valign = center
}

# FINGERPRINT STATUS (under the input field) — $FPRINTPROMPT carries the
# ready/scanning/fail text from the `auth { fingerprint }` block. The input-field
# only surfaces those mid-check, and its idle slot is taken by placeholder_text,
# so on a fast read the message just flashes. This label shows it on its own line
# instead: `Scan fingerprint to unlock` while waiting, `Scanning…` during a read.
label {
  monitor =
  text = $FPRINTPROMPT
  color = $subtext0
  font_size = 16
  font_family = $font
  position = 0, 100
  halign = center
  valign = bottom
}
