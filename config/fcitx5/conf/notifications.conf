# Notifications fcitx5 should never raise, by tip id.
#
# enumerate-group silences the "Switch group / Switched group to X" popup that
# fires on every input-preset.sh switch — the waybar indicator already says which
# preset is active, so the toast is pure noise. The id is the first argument of
# fcitx5's showTip() call; it sits next to those two strings in libFcitx5Core.
#
# The popup offers a "Do not show again" button, but that writes back to THIS
# file, which is a read-only symlink into the Nix store — so clicking it can
# never stick. Suppressing has to happen here, in the repo.
#
# Format note: fcitx5 stores a list option as a section named after the option,
# with the index as the key. Add further ids as 1=, 2=, …

# Hidden Notifications
HiddenNotifications=
[HiddenNotifications]
0=enumerate-group
